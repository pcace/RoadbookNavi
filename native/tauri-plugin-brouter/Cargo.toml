[package]
name = "tauri-plugin-brouter"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-brouter"
license = "GPL-3.0-only"
repository = "https://github.com/pcace/RoadbookNavi"
publish = false

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
