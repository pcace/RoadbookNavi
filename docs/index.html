      function normalizeLanguage(language) {
        const base = (language || '').toLowerCase().split(/[-_]/)[0];
        return Object.hasOwn(translations, base) ? base : 'en';
      }

      function setLanguage(language) {
        const selected = normalizeLanguage(language);
        const copy = translations[selected];
        document.documentElement.lang = selected;
        document.title = copy.title;
        document.querySelector('meta[name="description"]').content =
          copy.description;
        document.querySelectorAll('[data-text]').forEach(element => {
          const value = copy[element.dataset.text];
          const attribute = element.dataset.attribute;
          if (attribute) element.setAttribute(attribute, value);
          else element.textContent = value;
        });
        document.querySelectorAll('[data-language]').forEach(button => {
          const active = button.dataset.language === selected;
          button.classList.toggle('active', active);
          button.setAttribute('aria-pressed', String(active));
        });
        const online = [
          'roadbooknavi.de',
          'www.roadbooknavi.de',
          'localhost',
          '127.0.0.1',
        ].includes(location.hostname);
        document.querySelectorAll('[data-online-only]').forEach(element => {
          element.hidden = !online;
        });
        document.querySelector('a[data-online-only]').href =
          `app/?lng=${selected}`;
        document.querySelectorAll('[data-help-link]').forEach(link => {
          link.href = 'help/' + selected + '/';
        });
        try {
          localStorage.setItem('roadbooknavi-language', selected);
        } catch {}
        const url = new URL(location.href);
        if (url.searchParams.has('lng')) {
          url.searchParams.set('lng', selected);
          history.replaceState(history.state, '', url);
        }
      }

      document.querySelectorAll('[data-language]').forEach(button => {
        button.addEventListener('click', () =>
          setLanguage(button.dataset.language)
        );
      });

      let savedLanguage;
      try {
        savedLanguage = localStorage.getItem('roadbooknavi-language');
      } catch {}
      const requestedLanguage = new URLSearchParams(location.search).get('lng');
      const browserLanguage = (
        navigator.languages || [navigator.language]
      ).find(language =>
        Object.hasOwn(
          translations,
          (language || '').toLowerCase().split(/[-_]/)[0]
        )
      );
      setLanguage(
        requestedLanguage || savedLanguage || browserLanguage || 'en'
      );
