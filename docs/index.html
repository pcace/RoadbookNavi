<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="RoadbookNavi is a local route planner, roadbook editor, and navigation app."
    />

    <link rel="icon" href="icon.png" />

      <button type="button" data-language="en">EN</button>

    <a

      href="https://github.com/pcace/RoadbookNavi"
      data-text="githubLabel"

      <a
        class="sketch-link"

        data-text="heroDownload"

    </header>

    <main>
      <section class="section benefits">

      <section class="section downloads" id="download">
        <div class="container">
          <h2 data-text="downloadTitle"></h2>
          <p class="section-lead" data-text="downloadText"></p>
          <div class="actions">
            <a
              class="button primary"
              href="https://github.com/pcace/RoadbookNavi/releases/latest"
              data-text="downloadButton"
            ></a>
            <a
              class="button secondary"
              href="https://github.com/pcace/RoadbookNavi/issues"
              data-text="issuesButton"
            ></a>
          </div>
        </div>
      </section>

      <section class="section showcase">
        <div class="container wide">
          <h2 data-text="actionTitle"></h2>
          <div class="videos">
            <figure>
              <video
                src="videos/route-planning.mp4"
                autoplay
                loop
                muted
                playsinline
                controls
                preload="metadata"
              ></video>
              <figcaption data-text="routePlanningCaption"></figcaption>
            </figure>
            <figure>
              <video
                src="videos/flexible-display.mp4"
                autoplay

                muted
                playsinline
                controls
                preload="metadata"
              ></video>
              <figcaption data-text="navigationCaption"></figcaption>
            </figure>
          </div>
        </div>
      </section>

      <section class="section features">
        <div class="container">
          <h2 data-text="featuresTitle"></h2>
          <div class="feature-grid">
            <article>
              <h3 data-text="featureOneTitle"></h3>
              <ul>
                <li data-text="featureOneA"></li>
                <li data-text="featureOneB"></li>
                <li data-text="featureOneC"></li>

            <article>
              <h3 data-text="featureTwoTitle"></h3>

                <li data-text="featureTwoA"></li>

                <li data-text="featureTwoC"></li>

            </article>
            <article>
              <h3 data-text="featureThreeTitle"></h3>
              <ul>

                <li data-text="featureThreeC"></li>
              </ul>
            </article>
            <article>

              <ul>
                <li data-text="featureFourA"></li>
                <li data-text="featureFourB"></li>
                <li data-text="featureFourC"></li>

        </div>
      </section>
    </main>

    <footer>

      <nav aria-label="Project links">

      function setLanguage(language) {
        const selected = translations[language] ? language : 'en';
        const copy = translations[selected];
        document.documentElement.lang = selected;
        document.title = copy.title;
        document.querySelector('meta[name="description"]').content =
          copy.description;
        document.querySelectorAll('[data-text]').forEach(element => {
          const value = copy[element.dataset.text];
          const attribute = element.dataset.attribute;
          if (attribute) element.setAttribute(attribute, value);
          else element.textContent = value;
        });
        document.querySelectorAll('[data-language]').forEach(button => {
          const active = button.dataset.language === selected;
          button.classList.toggle('active', active);
          button.setAttribute('aria-pressed', String(active));
        });
        localStorage.setItem('roadbooknavi-language', selected);
      }

      document.querySelectorAll('[data-language]').forEach(button => {
        button.addEventListener('click', () =>
          setLanguage(button.dataset.language)
        );
      });

      setLanguage(localStorage.getItem('roadbooknavi-language') || 'en');
    </script>
