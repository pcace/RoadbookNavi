name: Bug report
description: Report reproducible incorrect behavior in RoadbookNavi
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve RoadbookNavi. Do not attach private route data unless you are comfortable publishing it.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RoadbookNavi version
      placeholder: 'For example: 1.38.3'
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest sequence that consistently triggers the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, screenshots, and a minimal RN2/GPX example can help when they contain no private data.
