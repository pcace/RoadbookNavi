name: Publish stable website

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/stable-pages.yml'
  workflow_dispatch:

concurrency:
  group: stable-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: stable-pages
    steps:
      - name: Check out stable source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: source
      - name: Prepare the stable website
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir site
          cp -a source/docs/. site/
          printf '%s\n' roadbooknavi.de > site/CNAME
          touch site/.nojekyll
          printf '{"repository":"pcace/RoadbookNavi","branch":"main","commit":"%s"}\n' "$SOURCE_SHA" > site/source.json
      - name: Check out the stable Pages repository
        uses: actions/checkout@v7
        with:
          repository: pcace/RoadbookNavi-stable
          ref: gh-pages
          ssh-key: ${{ secrets.STABLE_PAGES_DEPLOY_KEY }}
          path: published
      - name: Publish to the stable Pages branch
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$(cat site/CNAME)" = roadbooknavi.de
          rsync -a --delete --exclude=.git/ site/ published/
          cd published
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Publish RoadbookNavi main at $SOURCE_SHA"
            git push origin HEAD:gh-pages
          fi
