name: Pull request title

on:
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - name: Validate title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|build|ci|test|chore|revert)(\([a-z0-9][a-z0-9._/-]*\))?(!)?: .+$'

          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "Pull request title must use Conventional Commit syntax."
            echo "Examples:"
            echo "  feat: add route elevation preview"
            echo "  fix(map): retain the selected map style"
            echo "  perf!: replace the roadbook renderer"
            exit 1
          fi
