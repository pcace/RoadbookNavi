name: Pull request title

on:
  pull_request_target:
    branches:
      - main
      - dev
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - name: Validate title
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|build|ci|test|chore|revert)(\([a-z0-9][a-z0-9._/-]*\))?(!)?: .+$'

          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            message=$(cat <<'EOF'
          This pull request was closed because its title does not use Conventional Commit syntax.

          Please update the title and reopen the pull request. Examples:

          - `feat: add route elevation preview`
          - `fix(map): retain the selected map style`
          - `perf!: replace the roadbook renderer`
          EOF
            )

            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$message"
            gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
            exit 1
          fi
