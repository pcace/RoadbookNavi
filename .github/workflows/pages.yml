name: Publish production website

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Build the website available on main
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if node --input-type=module -e "import p from './package.json' with { type: 'json' }; process.exit(p.scripts['build:web'] ? 0 : 1)"; then
            pnpm install --frozen-lockfile
            pnpm test
            pnpm build:web
          else
            mkdir dist-web
            cp -a docs/. dist-web/
          fi
          printf '%s\n' roadbooknavi.de > dist-web/CNAME
          touch dist-web/.nojekyll
          printf '{"repository":"pcace/RoadbookNavi","branch":"main","commit":"%s"}\n' "$SOURCE_SHA" > dist-web/source.json
      - name: Link directly to published stable installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/website-downloads.mjs dist-web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require the production domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/${{ github.repository }}/pages --jq .cname)" = roadbooknavi.de
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
