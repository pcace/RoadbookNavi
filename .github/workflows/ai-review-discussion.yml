name: AI Review Discussion Event

on:
  pull_request_review_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]

# These events may use a PR ref. Run no PR code, use no secrets, and leave the
# privileged review to ai-review.yml on the default branch via workflow_run.
permissions: {}

jobs:
  signal:
    if: >-
      github.event.sender.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Signal changed PR discussion
        run: 'true'
