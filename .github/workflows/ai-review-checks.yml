name: AI Review Automation Checks

on:
  pull_request:
    paths:
      - .github/ai-review/**
      - .github/workflows/ai-review*
      - .github/review-context.md
      - .github/aw/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test authorization, stale output and conversation retries
        run: node .github/ai-review/review.test.cjs
      - name: Install the pinned workflow compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin v0.93.4
      - name: Verify generated workflow is current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh aw compile ai-review --no-check-update --no-logo
          git diff --exit-code -- .github/workflows/ai-review.lock.yml .github/aw/actions-lock.json
      - uses: github/gh-aw-actions/setup@40fb427c047bb9f77324054adeb574e04c9481aa
      - name: Test the compiled adapter through native ingestion and publication
        run: node .github/ai-review/framework.test.cjs
