name: Publish beta website and web app

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: beta-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build:web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require the beta domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/${{ github.repository }}/pages --jq .cname)" = beta.roadbooknavi.de
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
