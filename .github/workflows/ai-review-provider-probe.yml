name: AI Review Provider Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    # Manual, owner-only diagnostic. Never execute PR code with this secret.
    if: >-
      github.repository == 'pcace/RoadbookNavi' && github.actor == 'pcace' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the fixed free provider without logging secrets or prompts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 -B .github/ai-review/provider_probe.py
